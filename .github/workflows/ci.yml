name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  V_C_ERROR_BUG_REPORT_DISABLED: '1'
  V_MACOS_V3_NO_FALLBACK: '1'
  VFLAGS: -cc clang

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: brew install freetype harfbuzz fontconfig oniguruma pkg-config gettext
      - name: Install Metal toolchain
        # Xcode 26 ships the Metal compiler as a separate component.
        run: xcrun -f metal || xcodebuild -downloadComponent MetalToolchain
      - name: Install V
        run: bash .github/scripts/install-v.sh
      - name: Check
        run: v -check .
      - name: Build
        # Universal (arm64 + x86_64) app, as released. The standalone XCFramework
        # is skipped: its iOS slices need a V whose iOS C output compiles.
        # A cached build can omit declarations for specialized destructors.
        env:
          VFLAGS: -cc clang -nocache
        run: bash .github/scripts/ci-build.sh install -Demit-xcframework=false -Demit-macos-app=true
      - name: Verify app binary
        # Universal, and not tied to the CI runner's V install (libgc.dylib).
        run: |
          exe="$RUNNER_TEMP/witty/Ghostty.app/Contents/MacOS/ghostty"
          lipo -info "$exe"
          lipo "$exe" -verify_arch arm64
          lipo "$exe" -verify_arch x86_64
          libraries=$(otool -arch all -L "$exe")
          if [[ "$libraries" == *libgc* ]]; then
            printf '%s\n' "$libraries"
            exit 1
          fi
      - name: Package release
        if: inputs.release_tag != ''
        run: tar -czf "$RUNNER_TEMP/witty-macos-universal.tar.gz" -C "$RUNNER_TEMP" witty
      - uses: actions/upload-artifact@v7
        with:
          name: witty-macos
          path: ${{ inputs.release_tag != '' && format('{0}/witty-macos-universal.tar.gz', runner.temp) || format('{0}/witty', runner.temp) }}
          if-no-files-found: ${{ inputs.release_tag != '' && 'error' || 'warn' }}

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config gettext python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            libgtk-4-dev libadwaita-1-dev meson ninja-build \
            libfreetype-dev libharfbuzz-dev libfontconfig-dev libonig-dev \
            libx11-dev libwayland-dev wayland-protocols libgl-dev
      - name: Build gtk4-layer-shell
        # Ubuntu 24.04 does not package it; 1.1.0 is the version Ghostty pins.
        run: |
          git clone --depth 1 --branch v1.1.0 https://github.com/wmww/gtk4-layer-shell "$RUNNER_TEMP/gtk4-layer-shell"
          cd "$RUNNER_TEMP/gtk4-layer-shell"
          meson setup build --prefix=/usr -Dintrospection=false -Dvapi=false -Ddocs=false -Dexamples=false -Dtests=false
          ninja -C build
          sudo ninja -C build install
      - name: Install blueprint-compiler
        # Ghostty's UI files need 0.16.0+; Ubuntu 24.04's package is older.
        run: |
          git clone --depth 1 --branch v0.16.0 https://gitlab.gnome.org/GNOME/blueprint-compiler.git "$RUNNER_TEMP/blueprint-compiler"
          cd "$RUNNER_TEMP/blueprint-compiler"
          meson setup build --prefix=/usr
          sudo ninja -C build install
          blueprint-compiler --version
      - name: Install V
        run: bash .github/scripts/install-v.sh
      - name: Check
        run: v -check .
      - name: Verify standalone build generators
        run: |
          test ! -e .witty-build/native/libglslang.a
          v -path "$PWD|@vlib|@vmodules" run tools/helpgen > "$RUNNER_TEMP/helpgen.zig"
          v -path "$PWD|@vlib|@vmodules" run tools/docgen mdgen_ghostty_1 > "$RUNNER_TEMP/ghostty.1.md"
          v -path "$PWD|@vlib|@vmodules" run tools/build_data +vim-syntax > "$RUNNER_TEMP/ghostty.vim"
          test -s "$RUNNER_TEMP/helpgen.zig"
          test -s "$RUNNER_TEMP/ghostty.1.md"
          test -s "$RUNNER_TEMP/ghostty.vim"
      - name: Build
        run: bash .github/scripts/ci-build.sh install
      - name: Verify installed executable
        run: |
          test ! -e "$RUNNER_TEMP/witty/bin/ghostty"
          "$RUNNER_TEMP/witty/bin/witty" --version
      - name: Package release
        if: inputs.release_tag != ''
        run: tar -czf "$RUNNER_TEMP/witty-linux-x86_64.tar.gz" -C "$RUNNER_TEMP" witty
      - uses: actions/upload-artifact@v7
        with:
          name: witty-linux
          path: ${{ inputs.release_tag != '' && format('{0}/witty-linux-x86_64.tar.gz', runner.temp) || format('{0}/witty', runner.temp) }}
          if-no-files-found: ${{ inputs.release_tag != '' && 'error' || 'warn' }}

  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      # tools/build itself is compiled with MinGW gcc: clang's default MSVC
      # target hits MSVC-only intrinsics (_udiv128) in V's runtime.
      VFLAGS: -cc gcc
      # The build driver passes clang target triples (x86_64-w64-windows-gnu)
      # to the native and VT compiles, so those need clang.
      CC: clang
      CXX: clang++
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install V
        run: bash .github/scripts/install-v.sh
      - name: Build libghostty-vt
        run: bash .github/scripts/ci-build.sh lib-vt
      - name: Package release
        if: inputs.release_tag != ''
        shell: pwsh
        run: Compress-Archive -Path "$env:RUNNER_TEMP/witty" -DestinationPath "$env:RUNNER_TEMP/witty-vt-windows-x86_64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: witty-vt-windows
          path: ${{ inputs.release_tag != '' && format('{0}/witty-vt-windows-x86_64.zip', runner.temp) || format('{0}/witty', runner.temp) }}
          if-no-files-found: ${{ inputs.release_tag != '' && 'error' || 'warn' }}
