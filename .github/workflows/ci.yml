name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  V_C_ERROR_BUG_REPORT_DISABLED: '1'
  V_MACOS_V3_NO_FALLBACK: '1'
  VFLAGS: -cc clang

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: brew install freetype harfbuzz fontconfig oniguruma pkg-config gettext
      - name: Install Metal toolchain
        # Xcode 26 ships the Metal compiler as a separate component.
        run: xcrun -f metal || xcodebuild -downloadComponent MetalToolchain
      - name: Install V
        run: bash .github/scripts/install-v.sh
      - name: Check
        run: v -check .
      - name: Build
        # Universal (arm64 + x86_64) app, as released. The standalone XCFramework
        # is skipped: its iOS slices need a V whose iOS C output compiles.
        # A cached build can omit declarations for specialized destructors.
        env:
          VFLAGS: -cc clang -nocache
        run: bash .github/scripts/ci-build.sh install -Demit-xcframework=false -Demit-macos-app=true
      - name: Verify app binary
        # Universal, and not tied to the CI runner's V install (libgc.dylib).
        run: |
          exe="$RUNNER_TEMP/witty/Witty.app/Contents/MacOS/witty"
          test -f "$RUNNER_TEMP/witty/Witty.app/Contents/Resources/Witty.icns"
          test -z "$(find "$RUNNER_TEMP/witty" -iname '*ghostty*' -print -quit)"
          lipo -info "$exe"
          lipo "$exe" -verify_arch arm64
          lipo "$exe" -verify_arch x86_64
          libraries=$(otool -arch all -L "$exe")
          if [[ "$libraries" == *libgc* ]]; then
            printf '%s\n' "$libraries"
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            smoke_dir=$(mktemp -d "$RUNNER_TEMP/witty-app-smoke.XXXXXX")
            app="${exe%/Contents/MacOS/*}"
            ditto "$app" "$smoke_dir/${app##*/}"
            cd "$smoke_dir"
            # Debug builds can fall back to reading assets by absolute source path.
            trap 'if [[ -d "$smoke_dir/checkout" ]]; then mv "$smoke_dir/checkout" "$GITHUB_WORKSPACE"; fi' EXIT
            mv "$GITHUB_WORKSPACE" "$smoke_dir/checkout"
            "./${app##*/}/Contents/MacOS/${exe##*/}" --version
          fi
      - name: Package release
        if: inputs.release_tag != ''
        run: tar -czf "$RUNNER_TEMP/witty-macos-universal.tar.gz" -C "$RUNNER_TEMP" witty
      - uses: actions/upload-artifact@v7
        with:
          name: witty-macos
          path: ${{ inputs.release_tag != '' && format('{0}/witty-macos-universal.tar.gz', runner.temp) || format('{0}/witty', runner.temp) }}
          if-no-files-found: ${{ inputs.release_tag != '' && 'error' || 'warn' }}

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config gettext \
            libfreetype-dev libharfbuzz-dev libfontconfig-dev libonig-dev libglib2.0-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libwayland-dev wayland-protocols \
            libegl-dev libgl-dev libgl1-mesa-dri \
            python3-pil xauth xclip xdotool xvfb
      - name: Install V
        run: bash .github/scripts/install-v.sh
      - name: Install UI2
        run: bash .github/scripts/install-ui2.sh
      - name: Check
        run: v -path "$PWD|$PWD/.witty-build/ui2-modules|@vlib|@vmodules" -check .
      - name: Verify standalone build generators
        run: |
          test ! -e .witty-build/native/libglslang.a
          v -path "$PWD|@vlib|@vmodules" run tools/helpgen > "$RUNNER_TEMP/helpgen.zig"
          v -path "$PWD|@vlib|@vmodules" run tools/docgen mdgen_witty_1 > "$RUNNER_TEMP/witty.1.md"
          v -path "$PWD|@vlib|@vmodules" run tools/build_data +vim-syntax > "$RUNNER_TEMP/witty.vim"
          test -s "$RUNNER_TEMP/helpgen.zig"
          test -s "$RUNNER_TEMP/witty.1.md"
          test -s "$RUNNER_TEMP/witty.vim"
      - name: Build
        run: bash .github/scripts/ci-build.sh install
      - name: Verify installed executable
        run: |
          test -z "$(find "$RUNNER_TEMP/witty" -iname '*ghostty*' -print -quit)"
          exe="$RUNNER_TEMP/witty/bin/witty"
          "$exe" --version | tee "$RUNNER_TEMP/witty-version"
          grep -E 'app runtime +: ui2$' "$RUNNER_TEMP/witty-version"
      - name: Capture Linux terminal screenshots
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" \
            python3 build_support/reference_probes/render_parity/smoke_linux.py \
            "$RUNNER_TEMP/witty/bin/witty" --output "$RUNNER_TEMP/linux-screenshot-smoke"
      - name: Upload screenshot diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-screenshot-diagnostics
          path: ${{ runner.temp }}/linux-screenshot-smoke
          if-no-files-found: ignore
      - name: Package release
        if: inputs.release_tag != ''
        run: tar -czf "$RUNNER_TEMP/witty-linux-x86_64.tar.gz" -C "$RUNNER_TEMP" witty
      - uses: actions/upload-artifact@v7
        with:
          name: witty-linux
          path: ${{ inputs.release_tag != '' && format('{0}/witty-linux-x86_64.tar.gz', runner.temp) || format('{0}/witty', runner.temp) }}
          if-no-files-found: ${{ inputs.release_tag != '' && 'error' || 'warn' }}

  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      # tools/build itself is compiled with MinGW gcc: clang's default MSVC
      # target hits MSVC-only intrinsics (_udiv128) in V's runtime.
      VFLAGS: -cc gcc
      # The build driver passes clang target triples (x86_64-w64-windows-gnu)
      # to the native and VT compiles, so those need clang.
      CC: clang
      CXX: clang++
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install V
        run: bash .github/scripts/install-v.sh
      - name: Build libwitty-vt
        run: bash .github/scripts/ci-build.sh lib-vt
      - name: Verify installed library
        run: |
          test -f "$RUNNER_TEMP/witty/lib/libwitty-vt.dll"
          test -z "$(find "$RUNNER_TEMP/witty" -iname '*ghostty*' -print -quit)"
      - name: Package release
        if: inputs.release_tag != ''
        shell: pwsh
        run: Compress-Archive -Path "$env:RUNNER_TEMP/witty" -DestinationPath "$env:RUNNER_TEMP/witty-vt-windows-x86_64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: witty-vt-windows
          path: ${{ inputs.release_tag != '' && format('{0}/witty-vt-windows-x86_64.zip', runner.temp) || format('{0}/witty', runner.temp) }}
          if-no-files-found: ${{ inputs.release_tag != '' && 'error' || 'warn' }}
